# Next.js exports directory routes and a real 404.html; no SPA rewrite is needed.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  # Serve the static export without the Next SSR adapter; protected APIs use independent Functions.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Security and cache headers live in public/_headers, copied into out/ at build.

[[edge_functions]]
  function = "language"
  path = "/*"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "pdfkit"]
included_files = ["public/fonts/**/*.ttf"]

# Legacy public names preserve bookmarks without keeping duplicate canonical pages.
[[redirects]]
  from = "/:locale/studio/*"
  to = "/:locale/workshop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/:locale/submit/*"
  to = "/:locale/contribute/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/:locale/policies/takedown/*"
  to = "/:locale/policies/"
  status = 301
  force = true

[[redirects]]
  from = "/:locale/takedown/*"
  to = "/:locale/contact/"
  status = 301
  force = true

# Private route shells; API authorization is independent of these rewrites.

[[redirects]]
  from = "/en/account/works/:id"
  to = "/en/account/works/edit/"
  status = 200
  force = false

[[redirects]]
  from = "/en/admin/review/:id"
  to = "/en/admin/review/item/"
  status = 200
  force = false

