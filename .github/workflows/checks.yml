name: Rebuild verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks_checksums.txt"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing gitleaks_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: npm run check:secrets
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config netlify/edge-functions/language.ts
      - run: deno run --no-config --no-npm scripts/check-edge.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run check:brand
      - run: npm run test:copy
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:content
      - run: npm run build
      - run: npm test
      - run: npx tsx scripts/qa-fixture.tsx
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
