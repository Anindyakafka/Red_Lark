name: Rebuild verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks_checksums.txt"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing gitleaks_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: npm run check:secrets
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check --no-config netlify/edge-functions/language.ts
      - run: deno run --no-config --no-npm scripts/check-edge.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run check:brand
      - run: npm run check:docs
      - run: npm run test:copy
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:content
      - run: npm run build
      - run: npm test
      - run: npx tsx scripts/qa-fixture.tsx
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-test-results
          path: test-results/
